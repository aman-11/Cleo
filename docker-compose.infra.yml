
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cleo-postgres
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./.infra/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=mem0
    networks:
      - cleo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mem0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mem0:
    build:
      context: ./services/mem0
      dockerfile: Dockerfile
    container_name: cleo-mem0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=mem0user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=mem0
      - MEM0_API_KEY=${MEM0_API_KEY}
      # Qdrant Configuration (Cloud or local)
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION}
      # AI Model Configuration (100% FREE)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
      - MEM0_LLM_MODEL=${MEM0_LLM_MODEL}
      - MEM0_EMBEDDING_MODEL=${MEM0_EMBEDDING_MODEL}
    ports:
      - "127.0.0.1:8080:8080"  # Only localhost, for SSH tunnel access
    networks:
      - cleo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mem0-mcp:
    build:
      context: .
      dockerfile: packages/mem0-mcp-server/Dockerfile
    image: cleo/mem0-mcp:latest
    container_name: cleo-mem0-mcp
    environment:
      - MEM0_API_URL=http://mem0:8080
      - MEM0_API_KEY=${MEM0_API_KEY}
      - MCP_PORT=3001
      - MCP_ENDPOINT=/mcp
    networks:
      - cleo-network
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      mem0:
        condition: service_healthy
    restart: unless-stopped
    # MCP server running on HTTP transport for OpenClaw integration
    # Accessible at http://mem0-mcp:3001/mcp (internal) or http://localhost:3001/mcp (from host)
    labels:
      - "cleo.service=mem0-mcp"
      - "cleo.type=mcp-server"
    healthcheck:
      test: ["CMD-SHELL", "wget --server-response --spider -q http://localhost:3001/mcp 2>&1 | grep -q 'HTTP' && exit 0 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cleo:
    build:
      context: .
      dockerfile: Dockerfile
    image: cleo/app:latest
    container_name: cleo-app
    restart: unless-stopped
    depends_on:
      mem0:
        condition: service_healthy
    environment:
      - DISCORD_USER_ID=${DISCORD_USER_ID}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - OPENCLAW_API_URL=http://openclaw-openclaw-gateway-1:18789
      - MEM0_API_URL=http://mem0:8080
      - MEM0_API_KEY=${MEM0_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - WATCHED_USERNAME=${WATCHED_USERNAME}
      - WATCHED_REPOS=${WATCHED_REPOS:-github.com/${WATCHED_USERNAME}}
    networks:
      - cleo-network
    external_links:
      - openclaw-openclaw-gateway-1:openclaw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
    name: cleo-postgres-data

networks:
  cleo-network:
    name: cleo-network
    driver: bridge
