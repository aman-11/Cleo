services:
  cleo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cleo-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DISCORD_USER_ID=${DISCORD_USER_ID}
      - WATCHED_USERNAME=${WATCHED_USERNAME}
      - MEM0_API_URL=http://mem0:8080
      - MEM0_API_KEY=${MEM0_API_KEY}
      - OPENCLAW_API_URL=${OPENCLAW_API_URL:-http://openclaw:18789}
      - HEARTBEAT_CRON=${HEARTBEAT_CRON:-*/30 * * * *}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-cleo}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TAILSCALE_HOSTNAME=${TAILSCALE_HOSTNAME:-cleo-vps}
      - TAILSCALE_IP=${TAILSCALE_IP:-Unknown}
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - cleo-network
      - openclaw-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  cleo-network:
    external: true
    name: cleo-network
  openclaw-network:
    external: true
    name: openclaw_default
